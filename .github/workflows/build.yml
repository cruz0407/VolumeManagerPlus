name: Build TV APK

on:
  push:
    branches: [main, tv-remote]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore TV test signing key
        env:
          TV_DEBUG_KEYSTORE_BASE64: ${{ secrets.TV_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TV_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$TV_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Unit tests, APK and instrumentation test compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testTvDebugUnitTest :app:assembleTvDebug :app:assembleTvDebugAndroidTest
      - name: Android lint
        run: ./gradlew --no-daemon :app:lintTvDebug
      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk dist/Volume-Manager-TV.apk
          sha256sum dist/Volume-Manager-TV.apk > dist/SHA256SUMS.txt
          echo '### TV APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **Volume-Manager-TV** from Artifacts below, unzip and install the APK. Android 13+ and Shizuku are required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Volume-Manager-TV
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  remote-ui-tests:
    name: D-pad UI tests on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 240
            ./gradlew --no-daemon :app:connectedTvDebugAndroidTest
            mkdir -p ui-preview
            adb pull /sdcard/Android/data/moe.DDOne.volume.tv/files/tv-remote-preview.png ui-preview/
      - name: Upload UI checks and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-remote-UI-checks
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ui-preview/
          if-no-files-found: ignore
          retention-days: 14
